---
- hosts: web
  become: yes

  tasks:
    - name: Pull latest Docker image
      shell: docker pull myorg/myapp:latest

    - name: Restart container
      shell: |
        docker stop myapp || true
        docker rm myapp || true
        docker run -d \
          --name myapp \
          -p 80:8080 \
          myorg/myapp:latest
