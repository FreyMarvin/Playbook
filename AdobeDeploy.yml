- name: Install Adobe Reader
  hosts: windows
  tasks:
  
    - name: Create a Folder
      win_file:
        path: "c:\\installs"
        state: "directory"
        creates: "c:\\installs"

    - name: Copy Files
      win_copy:
        src: "/srv/Adobe/setup.exe"
        dest: "c:\\installs"
        creates: "c:\\installs\\Adobe/setup.exe"

    - name: install Adobe
      ansible.windows.win_package:
        path: "c:\\installs\\setup.exe"
        state: "present"
